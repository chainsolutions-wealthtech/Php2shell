name: auth-contract (offline only)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  signed-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-auth-contract.txt
      - run: python -m unittest discover -s auth_tests -v
